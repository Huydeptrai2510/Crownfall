<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trích engine Crownfall</title>
<style>body{font-family:system-ui,sans-serif;background:#04070a;color:#e6fff3;max-width:900px;margin:2rem auto;padding:0 1rem}
button{padding:.7rem 1.2rem;font-size:1rem;border-radius:8px;border:0;background:#19e68c;color:#02140c;font-weight:700;cursor:pointer;margin:.3rem .3rem .3rem 0}
textarea{width:100%;height:50vh;background:#050c0a;color:#e6fff3;border:1px solid #1f6f52;border-radius:8px;font-family:monospace;font-size:.8rem}
#msg{margin:.7rem 0;font-weight:700}</style></head>
<body>
<h1>Trích thư viện engine từ script.js</h1>
<p>Trang này đọc file <code>script.js</code> nằm cùng thư mục, cắt phần engine luật rồi hiện bên dưới. Bấm <b>Sao chép</b> và dán vào Boss → Quản lý BOT → Thư viện engine.</p>
<button id="go">1. Trích engine</button><button id="cp" disabled>2. Sao chép</button>
<p id="msg"></p>
<textarea id="out" readonly placeholder="Kết quả hiện ở đây…"></textarea>
<script>
const msg = document.getElementById('msg'), out = document.getElementById('out'), cp = document.getElementById('cp');
document.getElementById('go').onclick = async () => {
  try {
    const r = await fetch('script.js?x=' + Date.now()); if (!r.ok) throw new Error('Không đọc được script.js (HTTP ' + r.status + '). Trang này phải nằm cùng thư mục với script.js.');
    const s = await r.text();
    const a = s.indexOf('const SIZE = 9, BORDER_ROW = 4'), t = s.indexOf('TESTS (logic engine)'), b = t < 0 ? -1 : s.lastIndexOf('/*', t);
    if (a < 0 || b < a) throw new Error('Không thấy mốc engine trong script.js.');
    const lib = '/* Crownfall engine — trích từ script.js */\n' + s.slice(a, b) +
      '\nconst Crownfall = { SIZE, BORDER_ROW, SNAPSHOT_VERSION, RULES_ID, FACTION, PIECE_TYPES, GameState, Board, Piece, MovementRules, CaptureRules, ForbiddenZone, SpellPair, SpellSupport, KingCheck, KingSpellSwap, VictoryChecker, Legal, Actions, Notation, MoveHistory, WolfRules, other, ckey };\n';
    // kiểm tra thư viện biên dịch được và có đúng luật: thế cờ đầu P2 có 54 nước hợp lệ
    const C = new Function(lib + '\nreturn Crownfall;')();
    const n = C.GameState.legal(C.GameState.create()).length;
    out.value = lib; cp.disabled = false;
    msg.style.color = n === 54 ? '#5dffb0' : '#ff6b7d';
    msg.textContent = n === 54 ? 'OK: ' + lib.length + ' ký tự, kiểm tra 54 nước đầu ván khớp. Bấm "Sao chép".' : 'CẢNH BÁO: số nước đầu ván = ' + n + ' (kỳ vọng 54).';
  } catch (e) { msg.style.color = '#ff6b7d'; msg.textContent = 'Lỗi: ' + e.message; }
};
cp.onclick = async () => { try { await navigator.clipboard.writeText(out.value); msg.textContent = 'Đã sao chép! Giờ dán vào ô Thư viện engine.'; } catch (_) { out.select(); document.execCommand('copy'); msg.textContent = 'Đã chọn và sao chép (Ctrl+C nếu chưa được).'; } };
</script></body></html>
